[package]
name = "bit-not"
version = "0.1.0"
description = "BitNot — a local-first desktop music player"
authors = ["BitNot contributors"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which matters on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "bit_not_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
thiserror = "2"
log = { version = "0.4", features = ["std"] }
time = "0.3"
uuid = { version = "1", features = ["v4"] }
rodio = { version = "0.23.0", default-features = false, features = ["symphonia-all", "playback"] }
lofty = "0.25.5"
sha2 = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
notify = "8.2.2"
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
